plugins { id 'com.android.application' }

android {
    namespace 'com.moss.modelmod'
    compileSdk 34

    defaultConfig {
        applicationId "com.moss.modelmod"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        externalNativeBuild { cmake { cppFlags '-std=c++17' } }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions { jniLibs { useLegacyPackaging = true } }

    signingConfigs {
        release {
            storeFile file("../keystore/modelmod.jks")
            storePassword "modelmod123"
            keyAlias "modelmod"
            keyPassword "modelmod123"
            storeType "jks"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    compileOnly project(':stubs')
}
